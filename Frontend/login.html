<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | GreenLeaf Nursery</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {

            background: #f1f8f3;

            font-family: Arial, sans-serif;

        }


        .login-container {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .login-box {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.12);

        }


        .login-box h2 {

            color: #198754;

            text-align: center;

            margin-bottom: 25px;

        }


        .btn-green {

            background: #198754;

            color: white;

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

        }


        .btn-green:hover {

            background: #146c43;

            color: white;

        }


        .signup-link {

            text-align: center;

            margin-top: 20px;

        }


        .signup-link a {

            color: #198754;

            text-decoration: none;

            font-weight: bold;

        }


        .signup-link a:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-box">


        <h2>
            🌿 GreenLeaf Nursery
        </h2>


        <h4 class="text-center mb-4">
            Login
        </h4>


        <form id="loginForm">


            <!-- Email -->

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Password -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="btn-green">

                Login

            </button>


        </form>


        <div class="signup-link">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>


    </div>

</div>



<script>

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        const email =
            document.getElementById("loginEmail")
                .value
                .trim()
                .toLowerCase();

        const password =
            document.getElementById("loginPassword")
                .value;

        const loginButton = e.target.querySelector("button[type='submit']");
        const originalText = loginButton.innerText;
        loginButton.disabled = true;
        loginButton.innerText = "Logging in...";

        try {
            const response = await fetch("http://127.0.0.1:5000/api/users/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                alert("❌ " + data.message);
                return;
            }

            if (data.success) {
                localStorage.setItem("greenleafLoggedIn", "true");
                localStorage.setItem("greenleafUserName", data.user.name);
                localStorage.setItem("greenleafUserEmail", data.user.email);
                
                alert("🌿 Login successful!");
                window.location.href = "index.html";
            }

        } catch (error) {
            console.log(error);
            alert("❌ Cannot connect to server. Please make sure Node.js backend is running.");
        } finally {
            loginButton.disabled = false;
            loginButton.innerText = originalText;
        }

    }

);

</script>


</body>

</html>
