<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form in Table</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  
  <style>
    body {
      background-color: #f3f3f3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .form-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      margin-top: 60px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    table {
      margin-top: 20px;
    }

    h1 {
      color: maroon;
      font-weight: bold;
    }

    label {
      font-weight: 500;
    }

    .form-control {
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <div class="container form-container">
    <center>
      <h1>Feedback Form</h1>
    </center>
    <table class="table table-bordered">
      <tbody>
        <tr>
          <td><label for="validationCustom01" class="form-label">First Name</label></td>
          <td><input type="text" class="form-control" id="validationCustom01" placeholder="Enter your name" required></td>
        </tr>
        <tr>
          <td><label for="exampleFormControlInput1" class="form-label">Email Address</label></td>
          <td><input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter your email"></td>
        </tr>
        <tr>
          <td><label for="exampleFormControlTextarea1" class="form-label">Feedback</label></td>
          <td><textarea class="form-control" id="exampleFormControlTextarea1" rows="3" placeholder="Enter your feedback"></textarea></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
</body>

</html>
